<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Sendwave — Money Sent</title>
  <style>
    :root {
      --sw-yellow: #FFEC00;
      --sw-brown: #3C0F19;
      --sw-brown-soft: #5C2A35;
      --sw-blue: #16889B;
      --sw-bg: #FAF8F5;
      --sw-white: #FFFFFF;
      --sw-text: #1A0A0E;
      --sw-muted: #8A7078;
      --sw-border: #EDE5E0;
      --sw-success: #16A34A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: var(--sw-bg);
      color: var(--sw-text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .phone {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 740px;
      background: var(--sw-white);
      border-radius: 26px;
      box-shadow: 0 24px 70px -16px rgba(60,15,25,0.22), 0 6px 20px rgba(60,15,25,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .topbar {
      background: var(--sw-yellow);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(60,15,25,0.08);
      position: relative;
    }
    .topbar::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--sw-brown) 0%, var(--sw-brown) 30%, transparent 30%);
      opacity: 0.85;
    }
    .back-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(60,15,25,0.06);
      border: none;
      display: flex; align-items: center; justify-content: center;
      color: var(--sw-brown);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(60,15,25,0.12); }
    .back-btn svg { width: 18px; height: 18px; }
    .brand { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
    .brand-wordmark {
      color: var(--sw-brown);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.9px;
      line-height: 1;
    }
    .help-btn {
      font-size: 12px;
      font-weight: 700;
      color: var(--sw-brown);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .help-btn:hover { background: rgba(60,15,25,0.08); }
    .header-spacer { width: 32px; flex-shrink: 0; }

    /* CONTENT */
    .screen {
      flex: 1;
      padding: 20px 22px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .status-block { text-align: center; flex-shrink: 0; }
    .status-icon {
      width: 58px; height: 58px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: rgba(22,163,74,0.09);
      color: var(--sw-success);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .status-icon::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid rgba(22,163,74,0.12);
    }
    .status-icon svg { width: 26px; height: 26px; }
    .status-block h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--sw-text);
    }
    .status-block .sub { margin-top: 4px; font-size: 12px; }
    .muted { color: var(--sw-muted); font-size: 12px; }

    .amount-block {
      text-align: center;
      background: linear-gradient(155deg, var(--sw-yellow) 0%, #FFE940 100%);
      border-radius: 18px;
      padding: 20px 18px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .amount-block::before {
      content: "";
      position: absolute;
      top: -30px; right: -30px;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
    }
    .amount-block::after {
      content: "";
      position: absolute;
      bottom: -40px; left: -25px;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(60,15,25,0.05);
    }
    .amount-label {
      display: block;
      font-size: 10px;
      color: var(--sw-brown);
      margin-bottom: 6px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: 0.7;
      position: relative;
      z-index: 1;
    }
    .amount-value {
      font-size: 34px;
      font-weight: 900;
      color: var(--sw-brown);
      letter-spacing: -1.8px;
      display: flex;
      justify-content: center;
      gap: 6px;
      align-items: baseline;
      position: relative;
      z-index: 1;
      line-height: 1;
    }
    .amount-value #currencyText {
      font-size: 13px;
      font-weight: 800;
      color: var(--sw-brown-soft);
      letter-spacing: 0.5px;
    }

    .details-block {
      border: 1px solid var(--sw-border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--sw-white);
      flex-shrink: 0;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--sw-border);
      font-size: 13px;
      gap: 12px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label {
      color: var(--sw-muted);
      font-weight: 500;
      font-size: 12.5px;
      flex-shrink: 0;
    }
    .detail-row .value {
      font-weight: 700;
      color: var(--sw-text);
      text-align: right;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .detail-row .value.accent { color: var(--sw-blue); }

    .sender-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #FFFDF8;
      border-radius: 14px;
      border: 1px solid var(--sw-border);
      flex-shrink: 0;
    }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--sw-brown);
      color: var(--sw-yellow);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 17px;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }
    .sender-info { flex: 1; min-width: 0; }
    .sender-label {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--sw-muted);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      margin-bottom: 3px;
    }
    .sender-name {
      font-weight: 800;
      font-size: 15px;
      color: var(--sw-text);
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sender-meta { font-size: 11.5px; color: var(--sw-muted); margin-top: 2px; }

    /* FOOTER */
    .footer {
      padding: 16px 22px 22px;
      border-top: 1px solid var(--sw-border);
      background: var(--sw-white);
      flex-shrink: 0;
      margin-top: auto;
    }
    .btn-accept {
      width: 100%;
      padding: 16px;
      background: var(--sw-brown);
      color: var(--sw-yellow);
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      box-shadow: 0 6px 18px rgba(60,15,25,0.2);
      font-family: inherit;
    }
    .btn-accept:hover  { background: #2E0A12; }
    .btn-accept:active { transform: scale(0.985); }
    .secure-note {
      text-align: center;
      font-size: 10.5px;
      color: var(--sw-muted);
      margin-top: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-weight: 500;
    }
    .secure-note svg { width: 11px; height: 11px; }

    @media (max-height: 660px) {
      .status-icon { width: 50px; height: 50px; margin-bottom: 10px; }
      .status-icon svg { width: 22px; height: 22px; }
      .status-block h1 { font-size: 18px; }
      .amount-block { padding: 16px; }
      .amount-value { font-size: 30px; }
      .screen { gap: 12px; padding-top: 16px; }
      .detail-row { padding: 9px 16px; }
      .footer { padding: 14px 22px 18px; }
      .btn-accept { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="back-btn" aria-label="Back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="brand">
        <span class="brand-wordmark">sendwave〰</span>
      </div>
      <button class="help-btn">Help</button>
    </header>

    <main class="screen">
      <div class="status-block">
        <div class="status-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h1 id="statusText">Money Sent</h1>
        <p class="muted sub" id="referenceText">Ref: SW-2849163</p>
      </div>

      <div class="amount-block">
        <span class="amount-label">Amount Received</span>
        <div class="amount-value">
          <span id="currencyText">USD</span>
          <span id="amountText">250.00</span>
        </div>
      </div>

      <div class="sender-card">
        <div class="avatar" id="avatarInitial">J</div>
        <div class="sender-info">
          <div class="sender-label">Sent from</div>
          <div class="sender-name" id="senderNameText">John Doe</div>
          <div class="sender-meta" id="senderMetaText">United States</div>
        </div>
      </div>

      <div class="details-block">
        <div class="detail-row">
          <span class="label">Purpose</span>
          <span class="value" id="purposeText">Family Support</span>
        </div>
        <div class="detail-row">
          <span class="label">Request ID</span>
          <span class="value accent" id="requestIdText">REQ-8829104</span>
        </div>
        <div class="detail-row">
          <span class="label">Method</span>
          <span class="value" id="methodText">Mobile Money</span>
        </div>
        <div class="detail-row">
          <span class="label">Reference</span>
          <span class="value" id="refDetailText">SW-2849163</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <button class="btn-accept" id="acceptBtn">Accept Payment</button>
      <div class="secure-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Secured by Sendwave · 256-bit encryption
      </div>
    </footer>
  </div>

  <script>
    function render(s) {
      if (!s) return;
      if (s.status)         document.getElementById('statusText').textContent = s.status;
      if (s.currency)       document.getElementById('currencyText').textContent = s.currency;
      if (s.amount != null) document.getElementById('amountText').textContent =
        Number(s.amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (s.senderName) {
        document.getElementById('senderNameText').textContent = s.senderName;
        document.getElementById('avatarInitial').textContent = s.senderName.trim().charAt(0).toUpperCase();
      }
      if (s.senderCountry) document.getElementById('senderMetaText').textContent = s.senderCountry;
      if (s.purpose)       document.getElementById('purposeText').textContent = s.purpose;
      if (s.requestId)     document.getElementById('requestIdText').textContent = s.requestId;
      if (s.method)        document.getElementById('methodText').textContent = s.method;
      if (s.reference) {
        document.getElementById('referenceText').textContent = 'Ref: ' + s.reference;
        document.getElementById('refDetailText').textContent = s.reference;
      }
    }

    fetch('/api/state').then(r => r.json()).then(render).catch(() => {});

    try {
      const evt = new EventSource('/api/stream');
      evt.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_) {} };
    } catch (_) {}

    document.getElementById('acceptBtn').addEventListener('click', () => {
      window.location.href = 'mtn.html';
    });
  </script>
</body>
</html>
