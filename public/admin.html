<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Sendwave Flow</title>
  <style>
    :root {
      --sw-yellow: #FFEC00;
      --sw-brown: #3C0F19;
      --sw-brown-soft: #5C2A35;
      --sw-blue: #16889B;
      --sw-bg: #0F0709;
      --sw-card: #FFFFFF;
      --sw-text: #1A0A0E;
      --sw-muted: #8A7078;
      --sw-border: #EDE5E0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--sw-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 540px; }
    .card {
      background: var(--sw-card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 70px -16px rgba(0,0,0,0.5);
    }
    .card-head {
      background: var(--sw-yellow);
      padding: 22px 26px;
      border-bottom: 3px solid var(--sw-brown);
    }
    .card-head h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--sw-brown);
      letter-spacing: -0.5px;
    }
    .card-head p {
      font-size: 12px;
      color: var(--sw-brown-soft);
      margin-top: 4px;
      font-weight: 500;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--sw-brown);
      color: var(--sw-yellow);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 5px 10px;
      border-radius: 100px;
      margin-top: 10px;
    }
    .live-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--sw-yellow);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    form { padding: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      font-size: 11px;
      font-weight: 800;
      color: var(--sw-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--sw-border);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--sw-text);
      background: #FFFDF9;
      transition: border 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .field input:focus {
      outline: none;
      border-color: var(--sw-brown);
      box-shadow: 0 0 0 4px rgba(60,15,25,0.08);
      background: #fff;
    }
    .save-btn {
      grid-column: 1 / -1;
      padding: 15px;
      background: var(--sw-brown);
      color: var(--sw-yellow);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      margin-top: 6px;
      box-shadow: 0 6px 18px rgba(60,15,25,0.25);
    }
    .save-btn:hover { background: #2E0A12; }
    .save-btn:active { transform: scale(0.985); }
    .save-btn:disabled { opacity: 0.6; cursor: wait; }

    .meta {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 20px;
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translate(-50%, 20px);
      background: var(--sw-brown);
      color: var(--sw-yellow);
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 480px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <h1>Sendwave Admin</h1>
        <p>Edit and save — updates broadcast to all devices instantly</p>
        <span class="live-badge"><span class="dot"></span> LIVE SYNC ON</span>
      </div>

      <form id="adminForm">
        <div class="field full">
          <label>Status</label>
          <input type="text" name="status" placeholder="Money Sent" />
        </div>

        <div class="field">
          <label>Amount</label>
          <input type="number" step="0.01" name="amount" placeholder="250.00" />
        </div>

        <div class="field">
          <label>Currency</label>
          <input type="text" name="currency" placeholder="USD" />
        </div>

        <div class="field full">
          <label>Sender Name</label>
          <input type="text" name="senderName" placeholder="John Doe" />
        </div>

        <div class="field full">
          <label>Sender Country</label>
          <input type="text" name="senderCountry" placeholder="United States" />
        </div>

        <div class="field full">
          <label>Purpose</label>
          <input type="text" name="purpose" placeholder="Family Support" />
        </div>

        <div class="field">
          <label>Request ID</label>
          <input type="text" name="requestId" placeholder="REQ-8829104" />
        </div>

        <div class="field">
          <label>Transfer Method</label>
          <input type="text" name="method" placeholder="Mobile Money" />
        </div>

        <div class="field full">
          <label>Reference</label>
          <input type="text" name="reference" placeholder="SW-2849163" />
        </div>

        <button type="submit" class="save-btn">Save & Publish</button>
      </form>
    </div>

    <div class="meta" id="meta">—</div>
  </div>

  <div class="toast" id="toast">✓ Saved · Live on all devices</div>

  <script>
    const form = document.getElementById('adminForm');
    const meta = document.getElementById('meta');
    const toast = document.getElementById('toast');

    function setMeta(iso) {
      meta.textContent = 'Last published: ' + new Date(iso).toLocaleString();
    }

    async function load() {
      const res = await fetch('/api/state');
      const s = await res.json();
      Object.keys(s).forEach(k => { if (form.elements[k]) form.elements[k].value = s[k]; });
      setMeta(s.updatedAt);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('.save-btn');
      btn.disabled = true;
      btn.textContent = 'Publishing…';

      const payload = {};
      new FormData(form).forEach((v, k) => payload[k] = v);
      payload.amount = parseFloat(payload.amount) || 0;

      const res = await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      btn.disabled = false;
      btn.textContent = 'Save & Publish';
      setMeta(data.state.updatedAt);

      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });

    // Live-update the admin form if another admin device changes it
    const evtSource = new EventSource('/api/stream');
    evtSource.onmessage = (e) => {
      const s = JSON.parse(e.data);
      // Only update fields the user isn't actively typing in
      Object.keys(s).forEach(k => {
        const el = form.elements[k];
        if (el && document.activeElement !== el) el.value = s[k];
      });
      setMeta(s.updatedAt);
    };

    load();
  </script>
</body>
</html>
